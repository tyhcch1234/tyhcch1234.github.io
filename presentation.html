<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簡報館 · tyhcch1234</title>
<meta name="description" content="自製簡報收藏：線上翻閱、下載 PowerPoint。人物故事、專題整理，持續新增。">
<meta name="theme-color" content="#4f6ef7">
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --card-2:#fbfcff;
    --ink:#171c2b;
    --ink-2:#3b4256;
    --muted:#5f6779;
    --line:#e6e9f2;
    --line-strong:#d6dbea;
    --brand:#4f6ef7;
    --brand-2:#8b5cf6;
    --brand-ink:#3f5ce0;
    --gold:#b8862b;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.06);
    --shadow-hover:0 6px 16px rgba(16,24,40,.08), 0 20px 46px rgba(79,110,247,.16);
    --radius:18px;
    --wrap:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0d1017;
    --card:#161b24;
    --card-2:#1a202b;
    --ink:#e9edf7;
    --ink-2:#c4cbdb;
    --muted:#8b93a7;
    --line:#242c39;
    --line-strong:#2f3847;
    --gold:#e0b463;
    --brand-ink:#8fa3ff;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-hover:0 8px 18px rgba(0,0,0,.45), 0 22px 50px rgba(79,110,247,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1100px 520px at 8% -12%, rgba(79,110,247,.13), transparent 62%),
      radial-gradient(900px 460px at 100% -6%, rgba(139,92,246,.12), transparent 58%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(160%) blur(14px);
    -webkit-backdrop-filter:saturate(160%) blur(14px);
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar .inner{
    max-width:var(--wrap);margin:0 auto;padding:12px 20px;
    display:flex;align-items:center;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;text-decoration:none}
  .brand .dot{
    width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
  }
  .spacer{flex:1}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);
    color:var(--ink-2);cursor:pointer;display:grid;place-items:center;transition:.18s;
  }
  .icon-btn:hover{border-color:var(--line-strong);color:var(--ink);transform:translateY(-1px)}
  .icon-btn svg{width:18px;height:18px}
  .icon-btn .moon{display:none}
  html[data-theme="dark"] .icon-btn .sun{display:none}
  html[data-theme="dark"] .icon-btn .moon{display:block}

  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px 90px}

  /* ---------- hero ---------- */
  .hero{padding:64px 0 8px}
  .kicker{
    display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:800;
    letter-spacing:.16em;color:var(--brand-ink);text-transform:uppercase;
  }
  .kicker::before{content:"";width:26px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--brand),var(--brand-2))}
  h1{
    font-size:clamp(32px,5.2vw,46px);line-height:1.22;margin:16px 0 12px;
    letter-spacing:-.015em;font-weight:800;
  }
  .lead{max-width:660px;color:var(--muted);font-size:15.5px;margin:0}
  .count{
    display:inline-flex;align-items:baseline;gap:7px;margin-top:22px;padding:7px 15px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    font-size:12.5px;color:var(--muted);box-shadow:var(--shadow)
  }
  .count b{color:var(--brand-ink);font-size:15px}

  /* ---------- grid ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:24px;margin-top:30px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
  }
  .card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hover);border-color:var(--line-strong)}
  .thumb{position:relative;aspect-ratio:16/9;background:#071a2b;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .55s cubic-bezier(.2,.7,.3,1)}
  .card:hover .thumb img{transform:scale(1.035)}
  .tag{
    position:absolute;top:12px;left:12px;font-size:11px;font-weight:700;letter-spacing:.04em;
    padding:5px 10px;border-radius:8px;color:#fff;
    background:rgba(7,26,43,.72);border:1px solid rgba(255,255,255,.22);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .body{padding:18px 20px 20px;display:flex;flex-direction:column;flex:1}
  .body h2{font-size:17.5px;line-height:1.5;margin:0 0 8px;font-weight:700;letter-spacing:-.01em}
  .body p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.75}
  .meta{
    display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);
    padding-top:13px;border-top:1px solid var(--line);margin-top:auto
  }
  .meta span{display:inline-flex;align-items:center;gap:5px}
  .actions{display:flex;gap:9px;margin-top:14px}
  .btn{
    flex:1;text-align:center;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;
    border:1px solid var(--line-strong);background:transparent;color:var(--ink-2);
    text-decoration:none;cursor:pointer;transition:.18s;font-family:inherit
  }
  .btn:hover{background:var(--card-2);color:var(--ink)}
  .btn.primary{
    background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border-color:transparent;
    box-shadow:0 4px 12px rgba(79,110,247,.28)
  }
  .btn.primary:hover{filter:brightness(1.06)}

  /* ---------- note ---------- */
  .note{
    margin:46px 0 0;border:1px solid var(--line);border-radius:14px;
    background:var(--card);box-shadow:var(--shadow);padding:0 18px
  }
  .note summary{cursor:pointer;padding:15px 0;font-size:13px;color:var(--muted);font-weight:600}
  .note summary::marker{color:var(--brand)}
  .note .inner{padding:0 0 16px;font-size:13px;color:var(--muted);line-height:2}
  .note code{
    background:color-mix(in srgb, var(--brand) 12%, transparent);color:var(--brand-ink);
    padding:2px 6px;border-radius:5px;font-size:12.5px
  }

  footer{
    max-width:var(--wrap);margin:0 auto;padding:26px 20px 46px;
    border-top:1px solid var(--line);margin-top:54px;
    font-size:12px;color:var(--muted);display:flex;justify-content:space-between;
    flex-wrap:wrap;gap:8px
  }
  footer a{text-decoration:none;border-bottom:1px solid transparent}
  footer a:hover{border-color:currentColor}

  /* ---------- viewer ---------- */
  .viewer{
    position:fixed;inset:0;z-index:60;display:none;background:rgba(10,14,22,.78);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:18px
  }
  .viewer.open{display:flex;flex-direction:column}
  .viewer-bar{display:flex;align-items:center;gap:10px;max-width:1180px;width:100%;margin:0 auto 10px}
  .viewer-bar h3{margin:0;font-size:14px;font-weight:600;flex:1;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vbtn{
    background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);color:#fff;
    height:36px;padding:0 14px;border-radius:10px;cursor:pointer;font-size:13px;
    text-decoration:none;display:inline-flex;align-items:center;gap:6px;font-family:inherit
  }
  .vbtn:hover{background:rgba(255,255,255,.24)}
  .viewer iframe{flex:1;width:100%;max-width:1180px;margin:0 auto;border:0;border-radius:12px;background:#fff}

  @media (max-width:640px){
    .hero{padding:40px 0 6px}
    .grid{grid-template-columns:1fr;gap:18px;margin-top:22px}
    .wrap{padding:0 16px 70px}
    .topbar .inner{padding:10px 16px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="inner">
    <a class="brand" href="/"><span class="dot">T</span>tyhcch1234</a>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeToggle" type="button" title="切換深色模式" aria-label="切換深色模式">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6"/>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.5 14.6A8.4 8.4 0 1 1 9.4 3.5a6.8 6.8 0 0 0 11.1 11.1z"/>
      </svg>
    </button>
  </div>
</div>

<div class="wrap">

  <header class="hero">
    <div class="kicker">Presentations</div>
    <h1>簡報館</h1>
    <p class="lead">把看過的影片、做過的專題，整理成一頁一頁的簡報。可直接線上翻閱，也能下載 PowerPoint 原檔。</p>
    <div class="count"><b id="deckCount">0</b> 份簡報</div>
  </header>

  <main class="grid" id="grid"></main>

  <details class="note">
    <summary>＋ 之後要新增簡報，怎麼做？</summary>
    <div class="inner">
      1. 在 <code>presentations/</code> 底下開一個新資料夾，例如 <code>presentations/新簡報/</code>。<br>
      2. 放入 <code>deck.pdf</code>、<code>deck.pptx</code>、<code>cover.jpg</code>（封面圖，16:9）。<br>
      3. 打開本檔案，在 <code>DECKS</code> 陣列加一筆資料，存檔、上傳即可，版面會自動生成。
    </div>
  </details>

</div>

<footer>
  <span>© <span id="year"></span> tyhcch1234 · 簡報館</span>
  <span><a href="/">← 回學習與工具總覽</a></span>
</footer>

<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <h3 id="viewerTitle"></h3>
    <a class="vbtn" id="viewerOpen" target="_blank" rel="noopener">新視窗開啟</a>
    <a class="vbtn" id="viewerDownload" download>下載</a>
    <button class="vbtn" id="viewerClose" type="button">關閉</button>
  </div>
  <iframe id="viewerFrame" title="簡報預覽"></iframe>
</div>

<script>
/* ============================================================
   簡報清單｜新增一份簡報：複製一個 { ... } 區塊，改內容即可
   dir   : 資料夾路徑（結尾要有 /）
   file  : 檔名主體（不含副檔名）→ 會讀 dir + file + .pdf / .pptx
   cover : 封面圖檔名
   ============================================================ */
const DECKS = [
  {
    dir:   "presentations/olympic-eric/",
    file:  "deck",
    cover: "cover.jpg",
    tag:   "人物故事",
    title: "1 分 52 秒 72：奧運史上最慢，最響的掌聲",
    desc:  "2000 年雪梨奧運，赤道幾內亞選手 Eric Moussambani 用 1 分 52 秒游完 100 米自由泳，全場起立鼓掌。16 頁重點整理，附影片截圖。",
    slides: 16,
    date:   "2026-10-31"
  }

  /* ↓↓↓ 新簡報加在這裡（前面補一個逗號）↓↓↓
  ,{
    dir:   "presentations/another-deck/",
    file:  "deck",
    cover: "cover.jpg",
    tag:   "分類",
    title: "簡報標題",
    desc:  "一兩句介紹。",
    slides: 12,
    date:   "2026-11-05"
  }
  */
];

const grid   = document.getElementById('grid');
const viewer = document.getElementById('viewer');
const frame  = document.getElementById('viewerFrame');
const vTitle = document.getElementById('viewerTitle');
const vOpen  = document.getElementById('viewerOpen');
const vDL    = document.getElementById('viewerDownload');
const esc    = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

grid.innerHTML = DECKS.map((d, i) => {
  const pdf  = d.dir + d.file + '.pdf';
  const pptx = d.dir + d.file + '.pptx';
  return `
    <article class="card">
      <div class="thumb">
        <img src="${d.dir}${d.cover}" alt="${esc(d.title)}" loading="lazy" width="1280" height="720">
        ${d.tag ? `<span class="tag">${esc(d.tag)}</span>` : ''}
      </div>
      <div class="body">
        <h2>${esc(d.title)}</h2>
        <p>${esc(d.desc)}</p>
        <div class="meta">
          <span>◧ ${d.slides} 頁</span>
          <span>◷ ${esc(d.date)}</span>
        </div>
        <div class="actions">
          <a class="btn primary" href="${pdf}" target="_blank" rel="noopener" data-view="${i}">線上瀏覽</a>
          <a class="btn" href="${pptx}" download>下載 PPTX</a>
        </div>
      </div>
    </article>`;
}).join('');

document.getElementById('deckCount').textContent = DECKS.length;
document.getElementById('year').textContent = new Date().getFullYear();

/* ---------- 檢視器（手機直接開新視窗，桌面用燈箱） ---------- */
const isNarrow = () => window.matchMedia('(max-width: 820px)').matches;

function openViewer(i){
  const d = DECKS[i];
  vTitle.textContent = d.title;
  vOpen.href = d.dir + d.file + '.pdf';
  vDL.href   = d.dir + d.file + '.pptx';
  frame.src  = d.dir + d.file + '.pdf#view=FitH';
  viewer.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeViewer(){
  viewer.classList.remove('open');
  frame.src = '';
  document.body.style.overflow = '';
}
grid.addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  if (isNarrow()) return;            // 手機：交還給瀏覽器開 PDF
  e.preventDefault();
  openViewer(+b.dataset.view);
});
document.getElementById('viewerClose').addEventListener('click', closeViewer);
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });

/* ---------- 深色模式 ---------- */
(function () {
  var root = document.documentElement, saved = null;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
  document.getElementById('themeToggle').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });
})();
</script>
</body>
</html>
