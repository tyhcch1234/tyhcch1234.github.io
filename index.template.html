<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>學習與工具總覽 · tyhcch1234</title>
<meta name="description" content="tyhcch1234 的 GitHub Pages 全站導覽：自動同步所有 repo，可搜尋 repo 與站內頁面——數學題解、中文識字、小學常識、身心記憶、設計導覽、每日日誌與工具。">
<meta name="theme-color" content="#4f6ef7">
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --card-2:#fbfcff;
    --ink:#171c2b;
    --ink-2:#3b4256;
    --muted:#6e7688;
    --line:#e6e9f2;
    --line-strong:#d6dbea;
    --brand:#4f6ef7;
    --brand-2:#8b5cf6;
    --ok:#16a34a;
    --warn:#b45309;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 10px 30px rgba(16,24,40,.06);
    --shadow-hover:0 6px 16px rgba(16,24,40,.08), 0 20px 46px rgba(79,110,247,.16);
    --radius:18px;
    --wrap:1120px;
  }
  html[data-theme="dark"]{
    --bg:#0d1017;
    --card:#161b24;
    --card-2:#1a202b;
    --ink:#e9edf7;
    --ink-2:#c4cbdb;
    --muted:#8b93a7;
    --line:#242c39;
    --line-strong:#2f3847;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --shadow-hover:0 8px 18px rgba(0,0,0,.45), 0 22px 50px rgba(79,110,247,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(1100px 520px at 8% -12%, rgba(79,110,247,.13), transparent 62%),
      radial-gradient(900px 460px at 100% -6%, rgba(139,92,246,.12), transparent 58%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei","Noto Sans TC",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 20px 90px}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    backdrop-filter:saturate(160%) blur(14px);
    background:transparent;border-bottom:1px solid transparent;
    transition:border-color .25s, background .25s;
  }
  .topbar.stuck{border-bottom-color:var(--line);background:color-mix(in srgb, var(--bg) 88%, transparent)}
  .topbar .inner{max-width:var(--wrap);margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em;font-size:14.5px;text-decoration:none}
  .brand .mark{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;color:#fff;font-size:13.5px;font-weight:800;
    box-shadow:0 6px 16px rgba(79,110,247,.35);
  }
  .brand small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;letter-spacing:.02em}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .icon-btn{
    width:36px;height:36px;border-radius:11px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-2);display:grid;place-items:center;
    cursor:pointer;transition:transform .15s, border-color .15s, color .15s;
  }
  .icon-btn:hover{border-color:var(--line-strong);color:var(--brand);transform:translateY(-1px)}
  .icon-btn svg{width:17px;height:17px}
  .icon-btn .moon{display:none}
  html[data-theme="dark"] .icon-btn .sun{display:none}
  html[data-theme="dark"] .icon-btn .moon{display:block}
  .icon-btn.spin svg{animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- hero ---------- */
  header.hero{text-align:center;padding:64px 0 24px}
  .avatar{
    width:66px;height:66px;border-radius:21px;margin:0 auto 20px;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:grid;place-items:center;color:#fff;font-weight:800;font-size:27px;
    box-shadow:0 14px 36px rgba(79,110,247,.38);
  }
  h1{font-size:clamp(25px,4.4vw,36px);margin:0 0 10px;letter-spacing:-.025em;font-weight:800}
  .sub{color:var(--muted);margin:0;font-size:15px}
  .stat{
    display:inline-flex;flex-wrap:wrap;justify-content:center;gap:6px 20px;
    margin-top:20px;padding:9px 20px;
    background:color-mix(in srgb, var(--card) 70%, transparent);
    border:1px solid var(--line);border-radius:999px;
    font-size:13px;color:var(--muted);box-shadow:var(--shadow);
  }
  .stat b{color:var(--ink);font-variant-numeric:tabular-nums}
  .stat .live{display:inline-flex;align-items:center;gap:6px}
  .stat .live i{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.16)}
  .stat .live.warn i{background:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}

  /* ---------- search ---------- */
  .search-wrap{max-width:560px;margin:30px auto 10px}
  .search{position:relative}
  .search > svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
  .search input{
    width:100%;padding:14px 58px 14px 46px;border-radius:15px;
    border:1px solid var(--line);background:var(--card);color:var(--ink);
    font-size:15px;font-family:inherit;outline:none;box-shadow:var(--shadow);
    transition:border-color .18s, box-shadow .18s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(79,110,247,.15)}
  .search kbd{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-family:inherit;font-size:11.5px;color:var(--muted);
    border:1px solid var(--line);border-radius:7px;padding:2px 7px;background:var(--card-2);
  }
  .hint{text-align:center;font-size:12.4px;color:var(--muted);margin:10px 0 0;min-height:20px}
  .hint b{color:var(--ink)}
  .hint .warn{color:var(--warn)}

  /* ---------- filter chips ---------- */
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:18px auto 42px}
  .chip{
    font:inherit;font-size:13px;cursor:pointer;
    padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--ink-2);
    transition:all .16s ease;
  }
  .chip:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .chip[aria-pressed="true"]{
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    border-color:transparent;color:#fff;box-shadow:0 6px 18px rgba(79,110,247,.32);
  }
  .chip span{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

  /* ---------- sections ---------- */
  section{margin-bottom:44px;--accent:#4f6ef7}
  section[data-cat="math"]{--accent:#4f6ef7}
  section[data-cat="lang"]{--accent:#e0672f}
  section[data-cat="junior"]{--accent:#16a34a}
  section[data-cat="mind"]{--accent:#8b5cf6}
  section[data-cat="design"]{--accent:#0ea5e9}
  section[data-cat="daily"]{--accent:#db2777}
  section[data-cat="media"]{--accent:#7c3aed}
  section[data-cat="play"]{--accent:#ea580c}
  section[data-cat="tools"]{--accent:#0f766e}

  .sec-head{display:flex;align-items:center;gap:10px;margin:0 0 16px}
  .sec-head .glyph{
    width:28px;height:28px;border-radius:9px;flex:0 0 auto;display:grid;place-items:center;
    background:color-mix(in srgb, var(--accent) 12%, transparent);color:var(--accent);
  }
  .sec-head .glyph svg{width:15px;height:15px}
  h2{font-size:15px;font-weight:700;letter-spacing:.03em;margin:0}
  .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px;align-items:start}

  /* ---------- card ---------- */
  .card{
    position:relative;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:var(--radius);pointer-events:none;
    background:linear-gradient(135deg,color-mix(in srgb, var(--accent) 9%, transparent),transparent 52%);
    opacity:0;transition:opacity .18s ease;
  }
  .card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover);border-color:color-mix(in srgb, var(--accent) 34%, var(--line))}
  .card:hover::before{opacity:1}
  .card > .main{
    display:flex;align-items:flex-start;gap:13px;padding:17px 16px 10px;
    text-decoration:none;position:relative;z-index:1;
  }
  .card > .main:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:12px}
  .tile{
    width:34px;height:34px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;color:#fff;
    background:linear-gradient(135deg,var(--accent),color-mix(in srgb, var(--accent) 55%, #ffffff));
    box-shadow:0 6px 14px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .tile svg{width:17px;height:17px}
  .body{min-width:0;flex:1;padding-right:10px}
  .title{display:block;font-weight:650;font-size:14.5px;letter-spacing:-.005em;margin-bottom:3px}
  .desc{display:block;font-size:12.6px;color:var(--muted);line-height:1.5}
  .meta{display:block;margin-top:7px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
  .meta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
  .badge{
    font-size:10.6px;font-weight:650;letter-spacing:.02em;padding:1.5px 7px;border-radius:999px;
    background:color-mix(in srgb, var(--accent) 13%, transparent);color:var(--accent);
  }
  .badge.new{background:rgba(22,163,74,.14);color:#15803d}
  html[data-theme="dark"] .badge.new{color:#4ade80}
  .arrow{
    position:absolute;right:13px;top:16px;width:15px;height:15px;color:var(--muted);
    opacity:0;transform:translate(-3px,3px);transition:opacity .18s, transform .18s;
  }
  .card:hover .arrow{opacity:.75;transform:translate(0,0)}

  .pages-toggle{
    align-self:flex-start;margin:0 0 12px 63px;
    font:inherit;font-size:12.3px;color:var(--accent);background:transparent;border:0;
    padding:3px 0;cursor:pointer;display:inline-flex;align-items:center;gap:5px;
    position:relative;z-index:1;
  }
  .pages-toggle:hover{text-decoration:underline}
  .pages-toggle svg{width:12px;height:12px;transition:transform .18s}
  .card.open .pages-toggle svg{transform:rotate(180deg)}
  .pages{list-style:none;margin:0 16px 14px;padding:10px 0 0;border-top:1px dashed var(--line);display:none;position:relative;z-index:1}
  .card.open .pages{display:block}
  .pages li{margin:0}
  .pages a{
    display:flex;gap:10px;justify-content:space-between;align-items:baseline;
    padding:6px 8px;border-radius:9px;text-decoration:none;font-size:12.6px;color:var(--ink-2);
    position:relative;z-index:1;
  }
  .pages a:hover{background:color-mix(in srgb, var(--accent) 9%, transparent);color:var(--ink)}
  .pages a .p{
    color:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    flex:0 0 auto;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .pages .more-pages{display:flex;justify-content:center;padding-top:4px}
  .pages .more-pages button{
    font:inherit;font-size:12px;color:var(--muted);background:transparent;border:0;cursor:pointer;padding:4px 8px;
  }
  .pages .more-pages button:hover{color:var(--accent);text-decoration:underline}
  mark{background:color-mix(in srgb, var(--brand) 24%, transparent);color:inherit;border-radius:3px;padding:0 1px}

  /* ---------- empty / footer ---------- */
  .empty{display:none;text-align:center;padding:64px 0;color:var(--muted);font-size:14px}
  .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
  .empty button{
    margin-top:16px;font:inherit;font-size:13px;cursor:pointer;
    padding:8px 16px;border-radius:10px;border:1px solid var(--line);
    background:var(--card);color:var(--ink-2);
  }
  .footer{
    text-align:center;color:var(--muted);font-size:12.4px;
    margin-top:66px;padding-top:26px;border-top:1px solid var(--line);line-height:2;
  }
  .footer code{
    background:color-mix(in srgb, var(--brand) 10%, transparent);
    color:var(--brand);padding:2px 7px;border-radius:6px;font-size:11.8px;
  }
  .footer a{color:var(--ink-2);text-decoration:none;border-bottom:1px solid var(--line-strong)}
  .footer a:hover{color:var(--brand);border-color:var(--brand)}

  @media (max-width:560px){
    .wrap{padding:0 15px 70px}
    header.hero{padding:44px 0 18px}
    .grid{grid-template-columns:1fr}
    .search kbd{display:none}
    .search input{padding-right:16px}
    .pages-toggle{margin-left:16px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }
</style>
</head>

<div class="topbar" id="topbar">
  <div class="inner">
    <a class="brand" href="#top">
      <span class="mark">T</span>

    <div class="top-actions">
      <button class="icon-btn" id="syncBtn" type="button" title="重新掃描 GitHub repo（自動更新）" aria-label="重新掃描 GitHub repo">

      </button>
      <button class="icon-btn" id="themeToggle" type="button" title="切換深色模式" aria-label="切換深色模式">
        <svg class="sun"><use href="#i-sun"/></svg>
        <svg class="moon"><use href="#i-moon"/></svg>
      </button>
    </div>

<div class="wrap" id="top">

  <header class="hero">
    <div class="avatar">T</div>
    <h1>學習與工具總覽</h1>
    <p class="sub">開頁即時核對 GitHub 上所有 repo，網站與站內頁面全部列出</p>
    <div class="stat">
      <span><b id="statSites">–</b> 個網站</span>
      <span><b id="statPages">–</b> 個頁面</span>
      <span class="live" id="statLive"><i></i><span id="statSync">讀取中…</span></span>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜尋 repo 或站內頁面，例如「數學」「默書」「優惠」…"
             aria-label="搜尋網站與頁面">
      <kbd>/</kbd>
    </div>

  </div>

  <div class="chips" id="chips"></div>

  <noscript>
    <p style="text-align:center;color:#6e7688;font-size:14px">

    </p>

</div>
